[package]
name = "sml2-runtime"
version.workspace = true
edition = "2021"

[dependencies]
sml2-dx = { path = "../sml2-dx" }
sml2-core = { path = "../sml2-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

# The diagnostic CLI window; Android hosts the game through sml2-android instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
minifb = "0.28"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["audio"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.15"
