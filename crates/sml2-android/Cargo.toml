[package]
name = "sml2-android"
version.workspace = true
edition = "2021"
description = "Android TV (Google TV) host for Six Golden Coins"
publish = false

[lib]
name = "sml2_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

# Desktop builds of the workspace compile this crate as an empty library.
[target.'cfg(target_os = "android")'.dependencies]
sml2-desktop = { path = "../sml2-desktop" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity", "rwh_06"] }
jni = "0.21"
ndk-context = "0.1"
